<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N1 LAB · 管理员题库</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#243047;background:#f1f5f2}*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:auto;padding:24px 16px 70px}h1{margin:0 0 8px}p{color:#596679}.card{background:white;border:1px solid #dce7e1;border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 5px 20px #263d3210}input,textarea,select,button{font:inherit;border:1px solid #b9cfc3;border-radius:9px;padding:10px;max-width:100%}input,textarea,select{width:100%;background:white}textarea{min-height:76px}button{background:#267d60;color:white;cursor:pointer;border:0}button.secondary{background:#e8f0eb;color:#245740}button.danger{background:#b3434c}button:disabled{opacity:.5}label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row>*{flex:0 0 auto}.row input,.row select{width:auto;flex:1;min-width:150px}.item{border-top:1px solid #e6ece8;padding:12px 0}.muted{font-size:13px;color:#64756b}.status{padding:10px;border-radius:9px;background:#e6f1e9;white-space:pre-wrap}.warn{background:#fff1dc}a{color:#276d54}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:14px 10px}.card{padding:13px}}</style></head><body><main><div class="row"><h1>N1 LAB · 题库管理</h1><a href="./index.html">返回学习网站</a></div><p>仅管理员可操作。权限由 Supabase RLS 在服务器端验证。</p><div id="notice" class="status">正在检查登录身份…</div><div id="admin" hidden>
<section class="card"><h2>题库概览</h2><div id="stats"></div><div class="row"><button onclick="load()">刷新题库</button><button class="secondary" onclick="downloadJSON()">导出当前题库 JSON</button></div></section>
<section class="card"><h2 id="editTitle">新增题目</h2><div class="grid"><div><label>类别</label><select id="category"><option value="vocab">文字・語彙</option><option value="grammar">文法</option><option value="reading">読解</option></select></div><div><label>题型</label><input id="subtype" placeholder="如 文法形式判断"></div></div><label>日语题干（阅读题可包含完整文章）</label><textarea id="stem"></textarea><div class="grid" id="choices"></div><div class="grid"><div><label>正确选项</label><select id="answer"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div><div><label>难度 1–5</label><select id="difficulty"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div></div><label>中文解析</label><textarea id="explanation"></textarea><label>审核状态</label><select id="status"><option value="draft">待审核（不向普通用户显示）</option><option value="approved">审核通过</option><option value="rejected">驳回</option></select><div class="row" style="margin-top:15px"><button onclick="saveQuestion()">保存题目</button><button class="secondary" onclick="clearForm()">取消编辑</button></div></section>
<section class="card"><h2>批量导入</h2><p>选择 JSON 数组文件，每道题含 category、subtype、stem、choices（4 个选项）、answer_index（0–3）、explanation、difficulty。所有导入题目默认处于待审核状态。</p><input type="file" id="jsonFile" accept=".json,application/json"><div class="row" style="margin-top:12px"><button onclick="importJSON()">导入为待审核</button></div></section>
<section class="card"><h2>题目列表</h2><div class="row"><input id="search" placeholder="搜索题干或解析" oninput="draw()"><select id="filter" onchange="draw()"><option value="all">全部状态</option><option value="draft">待审核</option><option value="approved">已通过</option><option value="rejected">已驳回</option></select></div><div id="list"></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
'use strict';
const SUPABASE_URL='https://dhizmrxehdkdfyrgivrt.supabase.co',KEY='sb_publishable_c7qY1Lc4ZCUWlEG-cz8VXQ_T4SE1xgP',ADMIN_UID='a945f622-ce5a-45c8-93ee-1442c0a8e31f';
const db=window.supabase?.createClient(SUPABASE_URL,KEY),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
let rows=[],editing=null;
function msg(s,bad=false){$('notice').textContent=s;$('notice').className='status'+(bad?' warn':'')}
for(let i=0;i<4;i++){$('choices').insertAdjacentHTML('beforeend','<div><label>选项 '+String.fromCharCode(65+i)+'</label><input id="choice'+i+'"></div>')}
function clean(x){if(!x||!['vocab','grammar','reading'].includes(x.category)||typeof x.stem!=='string'||!x.stem.trim()||!Array.isArray(x.choices)||x.choices.length!==4||x.choices.some(v=>typeof v!=='string'||!v.trim())||!Number.isInteger(x.answer_index)||x.answer_index<0||x.answer_index>3)throw Error('题目格式不正确：请检查类别、题干、四个选项及答案编号');return {category:x.category,subtype:String(x.subtype||'general'),stem:x.stem.trim(),choices:x.choices,answer_index:x.answer_index,explanation:String(x.explanation||''),difficulty:Math.max(1,Math.min(5,Number(x.difficulty)||3)),status:x.status||'draft'}}
async function load(){msg('正在加载题库…');let all=[];for(let from=0;;from+=1000){let {data,error}=await db.from('questions').select('*').order('id',{ascending:false}).range(from,from+999);if(error){msg('读取失败：'+error.message,true);return}all.push(...data);if(data.length<1000)break}rows=all;msg('已加载 '+rows.length+' 道题');draw()}
function draw(){const counts={draft:0,approved:0,rejected:0};for(const r of rows)counts[r.status]=(counts[r.status]||0)+1;$('stats').textContent='共 '+rows.length+' 道 · 已通过 '+counts.approved+' · 待审核 '+counts.draft+' · 驳回 '+counts.rejected;const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const selected=rows.filter(r=>(f==='all'||r.status===f)&&(!q||(r.stem+' '+r.explanation).toLowerCase().includes(q)));$('list').innerHTML=selected.slice(0,150).map(r=>'<div class="item"><div><strong>#'+r.id+' · '+esc(r.subtype)+'</strong> <span class="muted">'+esc(r.category)+' · '+esc(r.status)+'</span></div><p>'+esc(r.stem.slice(0,160))+'</p><div class="row"><button class="secondary" onclick="edit('+r.id+')">编辑</button><button class="secondary" onclick="approve('+r.id+')">'+(r.status==='approved'?'转待审核':'审核通过')+'</button><button class="danger" onclick="removeQuestion('+r.id+')">删除</button></div></div>').join('')+(selected.length>150?'<p class="muted">仅显示前 150 道，请使用搜索缩小范围。</p>':'')}
function clearForm(){editing=null;$('editTitle').textContent='新增题目';for(const id of ['stem','subtype','explanation'])$(id).value='';for(let i=0;i<4;i++)$('choice'+i).value='';$('category').value='vocab';$('answer').value='0';$('difficulty').value='3';$('status').value='draft'}
function edit(id){const r=rows.find(x=>x.id===id);if(!r)return;editing=id;$('editTitle').textContent='编辑 #'+id;for(const k of ['category','subtype','stem','explanation','difficulty','status'])$(k).value=r[k];$('answer').value=r.answer_index;for(let i=0;i<4;i++)$('choice'+i).value=r.choices[i];window.scrollTo({top:280,behavior:'smooth'})}
async function saveQuestion(){try{const x=clean({category:$('category').value,subtype:$('subtype').value,stem:$('stem').value,choices:[0,1,2,3].map(i=>$('choice'+i).value),answer_index:Number($('answer').value),difficulty:Number($('difficulty').value),explanation:$('explanation').value,status:$('status').value});const res=editing?await db.from('questions').update(x).eq('id',editing):await db.from('questions').insert(x);if(res.error)throw res.error;clearForm();await load();msg('保存成功')}catch(e){msg('保存失败：'+e.message,true)}}
async function approve(id){const r=rows.find(x=>x.id===id);if(!r)return;const status=r.status==='approved'?'draft':'approved';const {error}=await db.from('questions').update({status}).eq('id',id);if(error)msg('更新失败：'+error.message,true);else await load()}
async function removeQuestion(id){if(!confirm('永久删除题目 #'+id+'？'))return;const {error}=await db.from('questions').delete().eq('id',id);if(error)msg('删除失败：'+error.message,true);else await load()}
async function importJSON(){try{const file=$('jsonFile').files[0];if(!file)throw Error('请选择 JSON 文件');const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed)||!parsed.length)throw Error('文件必须是非空 JSON 数组');const items=parsed.map(x=>clean({...x,status:'draft'}));if(!confirm('确定导入 '+items.length+' 道待审核题目？'))return;let count=0;for(let i=0;i<items.length;i+=100){const {error}=await db.from('questions').insert(items.slice(i,i+100));if(error)throw Error('已导入 '+count+' 道，随后失败：'+error.message);count+=Math.min(100,items.length-i)}await load();msg('成功导入 '+count+' 道待审核题目')}catch(e){msg('导入失败：'+e.message,true)}}
function downloadJSON(){const blob=new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=window.URL.createObjectURL(blob);a.download='n1-lab-questions.json';a.click();setTimeout(()=>window.URL.revokeObjectURL(a.href),1000)}
(async()=>{if(!db){msg('Supabase 组件加载失败，请检查网络或 CDN',true);return}try{msg('正在检查登录状态…');const auth=db.auth.getUser();const timeout=new Promise((_,reject)=>setTimeout(()=>reject(new Error('身份验证超过 12 秒。请确认主页已登录，并检查 Supabase 网络连接。')),12000));const {data,error}=await Promise.race([auth,timeout]);if(error)throw error;if(!data?.user){msg('未登录：请先在 N1 LAB 首页登录，再打开管理员后台。',true);return}if(data.user.id!==ADMIN_UID){msg('当前账号没有管理员权限。',true);return}$('admin').hidden=false;await load()}catch(e){msg('登录检查失败：'+(e?.message||String(e)),true)}})();
</script></body></html>
