['reading','読解','ある図書館では、貸出冊数を増やすために人気のある本を多く購入してきた。しかし、利用者への調査では、蔵書の多様性を求める声も少なくなかった。そこで図書館は、貸出数だけでなく、普段手に取られにくい分野の本との出会いも重視する方針に転換した。','図書館が方針を変えた理由は何か。','貸出数以外の価値も重視するため','人気の本が入手できなくなったため','利用者数が急に減ったため','調査で貸出停止が求められたため','貸出数以外の価値も重視するため','转折「しかし」之后提出多样性需求，结论是评价指标不只看借阅量。'],
['reading','読解','新しい道具が仕事を速くするとは限らない。使い方を覚える時間や、既存の手順との調整が必要だからだ。導入直後の効率だけで成否を判断するのではなく、時間をかけて仕事の進め方そのものがどう変わるかを見るべきだろう。','筆者が最も主張したいことは何か。','道具の評価には長期的な視点が必要だ','新しい道具は導入しないほうがよい','作業速度だけで道具を選ぶべきだ','導入前に全員が操作を覚えるべきだ','道具の評価には長期的な視点が必要だ','核心在「導入直後…ではなく」，应长期观察工作方式变化。'],

const options=q=>q[0]==='reading'?q.slice(4,8):q.slice(3,7);const answer=q=>q[0]==='reading'?q[8]:q[7];const explanation=q=>q[0]==='reading'?q[9]:q[8];// Cloud questions use stable negative indices; local demo IDs remain 0..24.
const localCount=Q.length;
const cloudQuestionIds=new Set();
function addCloudQuestions(rows){
 for(const row of rows){
  const id=-Number(row.id);
  if(!Number.isSafeInteger(id)||id>=0||cloudQuestionIds.has(id))continue;
  if(!Array.isArray(row.choices)||row.choices.length!==4||!Number.isInteger(row.answer_index)||row.answer_index<0||row.answer_index>3)continue;
  let passage=row.stem,readingQuestion='';
  if(row.category==='reading'){
   const match=String(row.stem).match(/(?:^|\\n)\\s*(?:【問題】|【設問】|問題[:：]|設問[:：])\\s*/);
   if(match){const pos=match.index+match[0].length;passage=row.stem.slice(0,match.index).trim();readingQuestion=row.stem.slice(pos).trim()}
   else readingQuestion='次の文章を読んで、最も適切なものを選びなさい。';
  }
  const q=row.category==='reading'?[row.category,row.subtype||'読解',passage,readingQuestion,...row.choices,row.choices[row.answer_index],row.explanation||'']:[row.category,row.subtype||row.category,row.stem,...row.choices,row.choices[row.answer_index],row.explanation||''];
  Q[id]=q;cloudQuestionIds.add(id);
 }
}

function go(p){if(session&&session.mode==='exam'&&p!=='exam'&&!confirm('离开将结束当前模拟考试，确定吗？'))return;if(session){clearInterval(timer);session=null}page=p;menu();render();window.scrollTo(0,0)}
function render(){if(session){renderQuestion();return}const app=$('app');if(page==='home'){let count=today().length;app.innerHTML=shell('你的 N1 学习空间','少一点压力，多一点扎实的进步。',`<div class="hero"><div><div class="eyebrow" style="color:#adc0ff">READY FOR YOUR NEXT STEP?</div><h1>今日，也向 N1 前进一步。</h1><p>从一个词汇、一段阅读开始。答题进度会自动同步到云端。</p><button class="btn" onclick="go('practice')">开始今日练习 →</button></div><div style="font-size:72px;opacity:.65">日本語</div></div><div class="grid section"><div class="card"><div class="sub">今日答题</div><div class="stat">${count} <small style="font-size:14px">题</small></div><div class="sub">每天一点，积累更稳</div></div><div class="card"><div class="sub">累计正确率</div><div class="stat">${answered()?Math.round(correct()/answered()*100):0}%</div><div class="bar"><div class="fill" style="width:${answered()?correct()/answered()*100:0}%"></div></div></div><div class="card"><div class="sub">错题待复习</div><div class="stat">${state.wrong.length} <small style="font-size:14px">题</small></div><button class="btn secondary" onclick="go('wrong')">复习错题 →</button></div></div><div class="section"><h2>快捷开始</h2><div class="grid">${[['vocab','語彙训练','读音 · 词义 · 用法'],['grammar','文法训练','N1 语法 · 语境判断'],['reading','読解训练','论点 · 推理 · 细节']].map(([t,n,d])=>`<button class="tile" onclick="startPractice('${t}')"><strong>${n} ↗</strong><span>${d}</span></button>`).join('')}</div></div>`)}else if(page==='practice'){app.innerHTML=shell('题库练习','选择题型，开始训练。当前为少量原创示范题，后续可接入大规模题库。',`<div class="grid">${[['all','混合练习','所有题型随机混合'],['vocab','文字・語彙','词汇及表达'],['grammar','文法','高级语法'],['reading','読解','短篇阅读理解']].map(([t,n,d])=>`<button class="tile" onclick="startPractice('${t}')"><strong>${n}</strong><span>${d} · ${t==='all'?availableIds().length:availableIds().filter(id=>Q[id]?.[0]===t).length} 题</span></button>`).join('')}</div><div class="card section"><h2>练习说明</h2><p class="sub">每题提交后可查看正确答案与中文解析；错题自动加入错题本。每次练习顺序会打乱，题目可重复练习。</p></div>`)}else if(page==='exam'){app.innerHTML=shell('模拟考试','独立原创笔试练习；不包含听力，不代表 JLPT 官方模拟分数。',`<div class="split"><div class="card"><span class="tag">TIMED MOCK</span><h2 style="margin-top:15px">限时笔试模拟</h2><p class="sub">从当前题库抽取最多 20 道题，限时 30 分钟；交卷后统一查看答案和正确率。题库扩充后可调整为更接近正式笔试的结构与 110 分钟时长。</p><button class="btn" onclick="startExam()">开始限时模拟 →</button></div><div class="card"><h2>最近成绩</h2>${state.examHistory.length?state.examHistory.slice(-4).reverse().map(x=>`<div class="listitem">${x.day} · ${x.ok}/${x.total} 题正确 · ${Math.round(x.ok/x.total*100)}%</div>`).join(''):'<p class="sub">暂无考试记录。</p>'}<div class="warning section">目前只显示原始正确率。没有听力和正式标定数据，不能可靠换算 JLPT 官方尺度得分。</div></div></div>`)}else if(page==='wrong'){app.innerHTML=shell('错题本','重新挑战做错的题，巩固薄弱知识点。',`<div class="card"><h2>待复习 · ${state.wrong.length} 题</h2>${state.wrong.length?`<div class="row"><button class="btn" onclick="startWrong()">复习全部错题 →</button><button class="btn outline" onclick="if(confirm('清空错题本？')){state.wrong=[];save();render()}">清空错题本</button></div><div class="list section">${state.wrong.filter(id=>Q[id]).map(id=>`<div class="listitem"><span class="tag">${Q[id][1]}</span>　${esc(Q[id][2].slice(0,65))}</div>`).join('')}</div>`:'<p class="sub">目前没有错题。答错的题目会自动出现在这里。</p>'}</div>`)}else if(page==='stats'){let days=Array.from({length:28},(_,i)=>{let d=new Date();d.setDate(d.getDate()-27+i);return d.toLocaleDateString('en-CA')});let active=unique(state.history.map(x=>x.day));app.innerHTML=shell('学习统计','记录每日答题与正确率。学习记录将同步到云端。',`<div class="grid"><div class="card"><div class="sub">累计答题</div><div class="stat">${answered()}</div></div><div class="card"><div class="sub">累计正确</div><div class="stat">${correct()}</div></div><div class="card"><div class="sub">打卡天数</div><div class="stat">${active.length}</div></div></div><div class="split section"><div class="card"><h2>最近 28 天打卡</h2><div class="calendar">${days.map(d=>`<div class="day ${active.includes(d)?'done':''}" title="${d}">${d.slice(8)}</div>`).join('')}</div><p class="sub">绿色代表当天完成过至少一道题。</p></div><div class="card"><h2>题型正确率</h2>${['vocab','grammar','reading'].map(t=>{let a=state.history.filter(x=>Q[x.id]&&Q[x.id][0]===t),r=a.length?Math.round(a.filter(x=>x.ok).length/a.length*100):0;return `<p class="sub">${{vocab:'文字・語彙',grammar:'文法',reading:'読解'}[t]} · ${a.length} 次 · ${r}%</p><div class="bar"><div class="fill" style="width:${r}%"></div></div>`}).join('')}<p class="sub">AI 学习建议将在接入后端后启用。</p></div></div>`)}else if(page==='settings'){app.innerHTML=shell('设置与数据','账号由管理员创建，学习记录自动同步到云端。',`<div class="split"><div class="card"><h2>本地资料</h2><div class="form"><label>显示昵称</label><input id="nickname" maxlength="25" value="${esc(state.name)}"><button class="btn" onclick="state.name=$('nickname').value.trim()||'学习者';save();alert('已保存')">保存昵称</button><button class="btn secondary" onclick="exportData()">导出学习数据 JSON</button><label>导入学习数据 JSON</label><input type="file" accept="application/json" id="importfile" onchange="importData(event)"></div></div><div class="card"><h2>后端接入状态</h2><div class="tag">已连接 Supabase</div><p class="sub">已启用登录和云端学习记录同步。AI 对话尚未接入。账号密码与私密 API 密钥不应直接写在前端代码里。</p><button class="btn outline" onclick="if(confirm('确定删除本机全部学习数据？')){localStorage.removeItem(dbKey);location.reload()}">清除本机数据</button></div></div>`)} }
function shuffled(ids){return [...ids].sort(()=>Math.random()-.5)}
function startPractice(type){const ids=shuffled(availableIds().filter(i=>type==='all'||Q[i][0]===type));session={mode:'practice',ids,pos:0,answers:{},checked:{},started:Date.now()};page='practice';menu();renderQuestion()}
function startWrong(){const ids=state.wrong.filter(id=>Q[id]);if(!ids.length){state.wrong=[];save();render();return}session={mode:'practice',ids:shuffled(ids),pos:0,answers:{},checked:{},started:Date.now()};page='wrong';menu();renderQuestion()}
function startExam(){session={mode:'exam',ids:shuffled(availableIds()).slice(0,20),pos:0,answers:{},checked:{},deadline:Date.now()+30*60*1000,started:Date.now()};page='exam';menu();renderQuestion();clearInterval(timer);timer=setInterval(()=>{if(!session||session.mode!=='exam'){clearInterval(timer);return}let t=$('clock');if(t)t.textContent=fmt(Math.max(0,Math.ceil((session.deadline-Date.now())/1000)));if(Date.now()>=session.deadline)finishExam()},1000)}
function choose(i){if(!session)return;let id=session.ids[session.pos];if(session.checked[id])return;session.answers[id]=i;renderQuestion()}
function check(){if(!session)return;let id=session.ids[session.pos],q=Q[id],v=session.answers[id];if(v===undefined||session.checked[id]||!q)return;let ok=options(q)[v]===answer(q);session.checked[id]=true;state.history.push({id,ok,day:date(),at:Date.now(),mode:'practice'});if(!ok&&!state.wrong.includes(id))state.wrong.push(id);if(ok)state.wrong=state.wrong.filter(x=>x!==id);save();renderQuestion()}
function next(){if(!session)return;if(session.pos===session.ids.length-1){finishPractice();return}session.pos++;renderQuestion()}
function renderQuestion(){let s=session;if(!s)return;let id=s.ids[s.pos],q=Q[id],selected=s.answers[id],checked=!!s.checked[id],exam=s.mode==='exam',opts=options(q);$('app').innerHTML=shell(exam?'限时模拟考试':'专项练习',`第 ${s.pos+1} / ${s.ids.length} 题 · ${q[1]}`,`<div class="card"><div class="row" style="justify-content:space-between"><span class="tag">${q[1]} · ${exam?'考试模式':'练习模式'}</span>${exam?`<strong id="clock">${fmt(Math.max(0,Math.ceil((s.deadline-Date.now())/1000)))}</strong>`:`<span class="sub">${s.pos+1} / ${s.ids.length}</span>`}</div><div class="bar section"><div class="fill" style="width:${(s.pos+1)/s.ids.length*100}%"></div></div>${q[0]==='grammar'&&/組み立て|排序|並べ替え/.test(q[1])?'<p class="sub">文の組み立て：将四个选项排入空格，选择位于 ★ 位置的片段。</p>':''}${q[0]==='reading'?`<div class="reading jp">${esc(q[2])}</div><div class="jp">${esc(q[3])}</div>`:`<div class="jp section">${esc(q[2])}</div>`}<div class="choices">${opts.map((v,i)=>`<button class="choice ${selected===i?'selected':''} ${checked&&v===answer(q)?'correct':''} ${checked&&selected===i&&v!==answer(q)?'wrong':''}" onclick="choose(${i})" ${checked?'disabled':''}>${i+1}. ${esc(v)}</button>`).join('')}</div>${checked?`<div class="explain"><strong>${options(q)[selected]===answer(q)?'✓ 回答正确':'✕ 回答错误'}</strong><br>正确答案：${esc(answer(q))}<br>${esc(explanation(q))}</div>`:''}<div class="row section">${exam?`<button class="btn secondary" onclick="session.pos=Math.max(0,session.pos-1);renderQuestion()" ${s.pos===0?'disabled':''}>上一题</button><button class="btn secondary" onclick="session.pos=Math.min(session.ids.length-1,session.pos+1);renderQuestion()" ${s.pos===s.ids.length-1?'disabled':''}>下一题</button><button class="btn" onclick="finishExam()">提交试卷</button>`:checked?`<button class="btn" onclick="next()">${s.pos===s.ids.length-1?'查看练习结果':'下一题 →'}</button>`:`<button class="btn" onclick="check()" ${selected===undefined?'disabled':''}>提交答案</button><button class="btn outline" onclick="if(confirm('结束本次练习？'))finishPractice()">结束练习</button>`}</div></div>`)}
function finishPractice(){let s=session;if(!s)return;let done=s.ids.filter(id=>s.checked[id]),ok=done.filter(id=>options(Q[id])[s.answers[id]]===answer(Q[id])).length;clearInterval(timer);session=null;$('app').innerHTML=shell('练习完成','本次练习总结',`<div class="card"><span class="tag">SESSION COMPLETE</span><div class="resultbig">${done.length?Math.round(ok/done.length*100):0}%</div><h2>${ok} / ${done.length} 题正确</h2><p class="sub">本次已作答 ${done.length} 题。答错的题目已收录到错题本。</p><div class="row"><button class="btn" onclick="go('practice')">继续练习</button><button class="btn secondary" onclick="go('wrong')">查看错题</button></div></div>`)}
function finishExam(){let s=session;if(!s||s.mode!=='exam')return;clearInterval(timer);let ok=0;s.ids.forEach(id=>{let a=s.answers[id],good=a!==undefined&&options(Q[id])[a]===answer(Q[id]);if(good)ok++;if(a!==undefined){state.history.push({id,ok:good,day:date(),at:Date.now(),mode:'exam'});if(!good&&!state.wrong.includes(id))state.wrong.push(id);if(good)state.wrong=state.wrong.filter(x=>x!==id)}});state.examHistory.push({day:date(),ok,total:s.ids.length});save();session=null;$('app').innerHTML=shell('模拟考试结果','这是原创题库的答题正确率，不是 JLPT 官方预测分。',`<div class="card"><span class="tag">MOCK TEST RESULT</span><div class="resultbig">${Math.round(ok/s.ids.length*100)}%</div><h2>答对 ${ok} / ${s.ids.length} 题</h2><p class="sub">未作答题目按错误计算。当前题库尚未标定，无法可靠预测 N1 尺度得分。</p><div class="list">${s.ids.map(id=>{let q=Q[id],a=s.answers[id],good=a!==undefined&&options(q)[a]===answer(q);return `<div class="listitem"><span style="color:${good?'#16906e':'#c75e65'}">${good?'✓':'✕'}</span> ${esc(q[0]==='reading'?q[3]:q[2])}<div class="sub">你的答案：${a===undefined?'未作答':esc(options(q)[a])} · 正确：${esc(answer(q))}</div><div class="sub">${esc(explanation(q))}</div></div>`}).join('')}</div><div class="row section"><button class="btn" onclick="go('exam')">返回模拟考试</button><button class="btn secondary" onclick="go('wrong')">复习错题</button></div></div>`)}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='n1-lab-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function importData(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!Array.isArray(x.history)||!Array.isArray(x.wrong)||!Array.isArray(x.examHistory))throw Error('格式不匹配');if(!confirm('导入将覆盖当前本地学习记录，继续吗？'))return;state={...initial,...x};save();render();alert('导入成功')}catch(err){alert('导入失败：'+err.message)}};reader.readAsText(f)}
menu();render();
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>#n1-auth{position:fixed;inset:0;background:#f5f7fb;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}#n1-auth .box{background:white;padding:30px;border-radius:18px;width:min(420px,100%);box-shadow:0 10px 40px #14203922}#n1-auth input{width:100%;padding:12px;margin:8px 0;border:1px solid #dce3ed;border-radius:9px}#n1-auth button{background:#4969e9;color:white;border:0;border-radius:9px;padding:12px;width:100%}#n1-status{position:fixed;bottom:12px;right:12px;background:#142039;color:white;padding:10px;border-radius:12px;z-index:500;font-size:12px}</style>
<div id="n1-auth"><div class="box"><h2>N1 LAB · 登录</h2><p>仅限管理员创建的账号使用。</p><form id="n1-form"><input id="n1-email" type="email" required placeholder="邮箱"><input id="n1-pass" type="password" required placeholder="密码"><button>登录</button></form><p id="n1-error" style="color:#c45b62"></p></div></div>

<script>
(()=>{
const client=window.supabase?.createClient('https://dhizmrxehdkdfyrgivrt.supabase.co','sb_publishable_c7qY1Lc4ZCUWlEG-cz8VXQ_T4SE1xgP');
const auth=document.getElementById('n1-auth'),status=document.getElementById('n1-status'),sync=document.getElementById('n1-sync');
let uid=null,delay=null;
if(!client){document.getElementById('n1-error').textContent='连接组件加载失败，请刷新重试';return}

 if(batchError){questionError=batchError;break}
 if(!batch?.length)break;
 questionRows.push(...batch);
 if(batch.length<500)break;
}
if(questionRows.length)addCloudQuestions(questionRows);
const cloudMessage=questionError?'云端题库读取失败（已加载 '+cloudQuestionIds.size+' 道）：'+questionError.message:`云端题目 ${cloudQuestionIds.size} 道`;

if(error){document.getElementById('n1-error').textContent='数据库尚未配置：请先运行 supabase-setup.sql';return}
if(data?.payload && Array.isArray(data.payload.history)){state={...initial,...data.payload}}
else{state=structuredClone(initial)}
localStorage.setItem(dbKey,JSON.stringify(state));auth.style.display='none';status.hidden=false;sync.textContent='已登录 · '+cloudMessage;render();
}
window.n1CloudSave=()=>{if(!uid)return;clearTimeout(delay);delay=setTimeout(async()=>{
sync.textContent='同步中…';

sync.textContent=error?'同步失败':'已同步';
},900)};

client.auth.getUser().then(({data})=>{if(data?.user)enter(data.user)}).catch(()=>{document.getElementById('n1-error').textContent='网络连接失败'});
